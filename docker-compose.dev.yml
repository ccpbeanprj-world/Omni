services:
  # PostgreSQL Database
  postgres:
    image: postgres:15

  # Redis Cache
  redis:
    image: redis:7-alpine

  # Backend API Service (Development with hot reload)
  backend:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN}
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET}
      - LINE_WEBHOOK_URL=${LINE_WEBHOOK_URL}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5174}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AI_ENABLED=${AI_ENABLED:-false}
      - AI_AUTO_REPLY_ENABLED=${AI_AUTO_REPLY_ENABLED:-false}
      - AI_PROVIDER=${AI_PROVIDER:-stub}
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./uploads:/app/uploads
      - /app/node_modules

  # Frontend React App (Development with hot reload)
  frontend:
    image: node:18-alpine
    working_dir: /app
    ports:
      - "5174:5174"
    environment:
      - NODE_ENV=development
    volumes:
      - ./omni-react-app:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"



